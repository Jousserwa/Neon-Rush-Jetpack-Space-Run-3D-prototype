name: Filament Renderer Spike

on:
  push:
    branches:
      - filament-renderer-spike
    paths:
      - "filament-spike/**"
      - ".github/workflows/filament-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-filament-spike:
    name: Build isolated Android renderer test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android API 36 and Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: gradle -p filament-spike :app:assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-rush-filament-spike-debug
          path: filament-spike/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
