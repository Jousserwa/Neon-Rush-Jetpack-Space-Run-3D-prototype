name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare persistent prototype signing key
        env:
          NR_KEYSTORE_BASE64: ${{ secrets.NR_KEYSTORE_BASE64 }}
          NR_KEYSTORE_PASSWORD: ${{ secrets.NR_KEYSTORE_PASSWORD }}
          NR_KEY_ALIAS: ${{ secrets.NR_KEY_ALIAS }}
          NR_KEY_PASSWORD: ${{ secrets.NR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$NR_KEYSTORE_BASE64" ] || [ -z "$NR_KEYSTORE_PASSWORD" ] || [ -z "$NR_KEY_ALIAS" ] || [ -z "$NR_KEY_PASSWORD" ]; then
            echo "::error::Persistent signing is not configured. Add the four NR_* repository Actions secrets described in README.md."
            exit 1
          fi
          echo "$NR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/neon-rush-prototype.jks"
          test -s "$RUNNER_TEMP/neon-rush-prototype.jks"
          echo "NR_KEYSTORE_PATH=$RUNNER_TEMP/neon-rush-prototype.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          NR_KEYSTORE_PASSWORD: ${{ secrets.NR_KEYSTORE_PASSWORD }}
          NR_KEY_ALIAS: ${{ secrets.NR_KEY_ALIAS }}
          NR_KEY_PASSWORD: ${{ secrets.NR_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-rush-3d-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
