name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare persistent prototype signing key (optional)
        id: signing
        env:
          NR_KEYSTORE_BASE64: ${{ secrets.NR_KEYSTORE_BASE64 }}
          NR_KEYSTORE_PASSWORD: ${{ secrets.NR_KEYSTORE_PASSWORD }}
          NR_KEY_ALIAS: ${{ secrets.NR_KEY_ALIAS }}
          NR_KEY_PASSWORD: ${{ secrets.NR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          values=("$NR_KEYSTORE_BASE64" "$NR_KEYSTORE_PASSWORD" "$NR_KEY_ALIAS" "$NR_KEY_PASSWORD")
          present=0
          for value in "${values[@]}"; do
            if [ -n "$value" ]; then present=$((present + 1)); fi
          done
          if [ "$present" -eq 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No persistent signing secrets found. Building with the temporary GitHub Actions debug key; uninstall the previous prototype before installing this APK."
          elif [ "$present" -ne 4 ]; then
            echo "::error::Signing secrets are incomplete. Add all four NR_* secrets or remove them all."
            exit 1
          else
            echo "$NR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/neon-rush-prototype.jks"
            test -s "$RUNNER_TEMP/neon-rush-prototype.jks"
            echo "NR_KEYSTORE_PATH=$RUNNER_TEMP/neon-rush-prototype.jks" >> "$GITHUB_ENV"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        env:
          NR_KEYSTORE_PASSWORD: ${{ secrets.NR_KEYSTORE_PASSWORD }}
          NR_KEY_ALIAS: ${{ secrets.NR_KEY_ALIAS }}
          NR_KEY_PASSWORD: ${{ secrets.NR_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-rush-3d-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
